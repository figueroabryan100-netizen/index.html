<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>NEXUS CORE — Multi-Agent Swarm Intelligence</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#050508;--panel:#0a0a10;--panel-border:#151520;--orion:#ffd700;--nova:#00d4ff;--echo:#a855f7;--sage:#00d084;--kai:#ff6b2c;--volt:#ffd700;--zeno:#ff4757;--lyra:#ff6b9d;--aura:#00b894;--pulse:#3498db;--text:#e8e8ec;--text-dim:#5a5a6a;--text-muted:#3a3a4a;--glow:0 0 30px rgba(255,215,0,0.15)}body{background:var(--bg);color:var(--text);font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--panel-border);border-radius:2px}/* Header */.header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--panel-border);background:var(--panel);z-index:100}.logo{display:flex;align-items:center;gap:10px}.logo-core{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--orion),#b8860b);box-shadow:0 0 20px rgba(255,215,0,0.3);animation:corePulse 3s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}.logo-text{font-size:16px;font-weight:800;letter-spacing:3px}.logo-sub{font-size:9px;color:var(--text-dim);letter-spacing:2px;margin-top:1px}.header-center{display:flex;gap:24px;align-items:center}.header-stat{display:flex;flex-direction:column;align-items:center}.header-stat-label{font-size:8px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}.header-stat-value{font-size:11px;font-weight:600;margin-top:1px}.header-right{display:flex;gap:16px;align-items:center}.live-badge{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;color:var(--sage)}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 8px var(--sage);animation:blink 2s ease-in-out infinite}/* Main Layout */.main{flex:1;display:grid;grid-template-columns:280px 1fr 320px;gap:1px;background:var(--panel-border);overflow:hidden}.panel{background:var(--bg);overflow:hidden;display:flex;flex-direction:column}/* Left Panel - Agents */.panel-left{padding:16px}.panel-title{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}.panel-title::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--orion)}.agent-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}.agent-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--panel-border);cursor:pointer;transition:all 0.2s ease;position:relative}.agent-item:hover{border-color:var(--text-muted);transform:translateX(2px)}.agent-item.active{border-color:var(--orion);background:rgba(255,215,0,0.03)}.agent-item-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}.agent-item-status.idle{background:var(--text-muted)}.agent-item-status.working{background:var(--sage);box-shadow:0 0 6px var(--sage);animation:blink 1.5s ease-in-out infinite}.agent-item-status.learning{background:var(--nova);box-shadow:0 0 6px var(--nova);animation:blink 1.5s ease-in-out infinite}.agent-item-info{flex:1;min-width:0}.agent-item-name{font-size:11px;font-weight:700;letter-spacing:1px}.agent-item-role{font-size:9px;color:var(--text-dim);margin-top:1px}.agent-item-mem{font-size:8px;color:var(--text-muted);margin-top:2px}.agent-item-pct{font-size:10px;font-weight:700}.agent-detail{margin-top:12px;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--panel-border);display:none}.agent-detail.show{display:block}.detail-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}.detail-icon{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}.detail-name{font-size:13px;font-weight:700}.detail-role{font-size:9px;color:var(--text-dim);margin-left:auto}.detail-section{margin-top:10px}.detail-section-title{font-size:8px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}.detail-memory{font-size:10px;color:var(--text-dim);line-height:1.6;max-height:120px;overflow-y:auto}.detail-knowledge{display:flex;flex-wrap:wrap;gap:4px}.k-tag{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,0.03);color:var(--text-dim);border:1px solid var(--panel-border)}/* Center Panel - Network */.panel-center{position:relative;overflow:hidden}.network-svg{position:absolute;inset:0;width:100%;height:100%}.network-svg circle{transition:all 0.3s ease}.network-svg line,.network-svg path{transition:all 0.3s ease}.agent-node{cursor:pointer;transition:all 0.3s ease}.agent-node:hover{filter:brightness(1.3)}.msg-particle{pointer-events:none}.center-info{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}.center-info .task-label{font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}.center-info .task-name{font-size:12px;font-weight:600;margin-top:2px;color:var(--orion)}.center-info .task-progress{font-size:10px;color:var(--text-dim);margin-top:4px}.center-info .consensus-bar{width:200px;height:4px;background:var(--panel-border);border-radius:2px;overflow:hidden;margin:6px auto 0}.center-info .consensus-fill{height:100%;border-radius:2px;transition:width 0.5s ease}/* Right Panel - Messages */.panel-right{padding:16px;display:flex;flex-direction:column}.msg-stream{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}.msg-item{padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--panel-border);font-size:10px;line-height:1.5;animation:msgIn 0.3s ease;position:relative;overflow:hidden}.msg-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px}.msg-item.from-ORION::before{background:var(--orion)}.msg-item.from-NOVA::before{background:var(--nova)}.msg-item.from-ECHO::before{background:var(--echo)}.msg-item.from-SAGE::before{background:var(--sage)}.msg-item.from-KAI::before{background:var(--kai)}.msg-item.from-VOLT::before{background:var(--volt)}.msg-item.from-ZENO::before{background:var(--zeno)}.msg-item.from-LYRA::before{background:var(--lyra)}.msg-item.from-AURA::before{background:var(--aura)}.msg-item.from-PULSE::before{background:var(--pulse)}.msg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.msg-from{font-weight:700;font-size:10px;letter-spacing:1px}.msg-to{font-size:8px;color:var(--text-dim)}.msg-time{font-size:8px;color:var(--text-muted)}.msg-body{color:var(--text-dim)}.msg-type{font-size:7px;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,0.03);color:var(--text-muted);margin-left:6px;text-transform:uppercase;letter-spacing:1px}.msg-controls{display:flex;gap:6px;margin-top:10px}.msg-input{flex:1;background:var(--panel);border:1px solid var(--panel-border);border-radius:4px;padding:6px 10px;color:var(--text);font-size:11px;outline:none}.msg-input:focus{border-color:var(--orion)}.msg-btn{background:var(--orion);color:#000;border:none;border-radius:4px;padding:6px 14px;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.2s}.msg-btn:hover{filter:brightness(1.2)}/* Bottom Bar */.bottom-bar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid var(--panel-border);background:var(--panel);font-size:9px;color:var(--text-dim);letter-spacing:1px}.bottom-left{display:flex;gap:16px}.bottom-right{display:flex;gap:16px}/* Animations */@keyframes corePulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.2)}50%{box-shadow:0 0 40px rgba(255,215,0,0.4)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}@keyframes msgIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@keyframes particleMove{to{offset-distance:100%}}@keyframes dashFlow{to{stroke-dashoffset:-20}}</style></head><body><div class='header'><div class='logo'><div class='logo-core'>◉</div><div><div class='logo-text'>NEXUS CORE</div><div class='logo-sub'>MULTI-AGENT SWARM INTELLIGENCE</div></div></div><div class='header-center'><div class='header-stat'><div class='header-stat-label'>AGENTS</div><div class='header-stat-value' id='statAgents'>10 ACTIVE</div></div><div class='header-stat'><div class='header-stat-label'>TASKS</div><div class='header-stat-value' id='statTasks'>0 QUEUED</div></div><div class='header-stat'><div class='header-stat-label'>MESSAGES</div><div class='header-stat-value' id='statMessages'>0</div></div><div class='header-stat'><div class='header-stat-label'>LEARNED</div><div class='header-stat-value' id='statLearned'>0 FACTS</div></div></div><div class='header-right'><div class='live-badge'><div class='live-dot'></div>SWARM LIVE</div></div></div><div class='main'><div class='panel panel-left'><div class='panel-title'>Swarm Agents</div><div class='agent-list' id='agentList'></div><div class='agent-detail' id='agentDetail'></div></div><div class='panel panel-center'><svg class='network-svg' id='networkSvg'></svg><div class='center-info'><div class='task-label'>Active Orchestration</div><div class='task-name' id='activeTask'>System Idle</div><div class='task-progress' id='taskProgress'>Waiting for input...</div><div class='consensus-bar'><div class='consensus-fill' id='consensusBar' style='width:0%;background:var(--sage)'></div></div></div></div><div class='panel panel-right'><div class='panel-title'>Inter-Agent Stream</div><div class='msg-stream' id='msgStream'></div><div class='msg-controls'><input class='msg-input' id='userInput' placeholder='Send a task to ORION...' type='text'><button class='msg-btn' id='sendBtn'>DELEGATE</button></div></div></div><div class='bottom-bar'><div class='bottom-left'><span id='bottomEngine'>NEXUS ENGINE v2.1</span><span id='bottomMode'>· SWARM CONSENSUS</span><span id='bottomLatency'>· LATENCY 12ms</span></div><div class='bottom-right'><span id='bottomSync'>AGENTS SYNCED 10/10</span><span id='bottomMem'>· MEM 34%</span><span id='bottomUptime'>· UPTIME 00:00</span></div></div><script src='nexus.js'></script></body></html>

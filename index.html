<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS AI — Command Center</title>
<style>
:root{--bg:#000;--panel:#050a05;--panel2:#0a110a;--accent:#00ff41;--text:#e0f0e0;--text2:#88aa88;--text3:#446644;--border:#112211;--font-h:'Orbitron',sans-serif;--font-m:monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-m);font-size:12px;height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:44px 1fr 36px;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{height:28px}
.nav-item{padding:6px 12px;font-size:10px;color:var(--text3);cursor:pointer;display:inline-block}
.nav-item.active{color:var(--accent)}
.main{display:grid;grid-template-columns:200px 1fr 260px}
.sidebar-left,.sidebar-right{background:var(--panel);border-right:1px solid var(--border);padding:8px;overflow-y:auto}
.sidebar-right{border-right:none;border-left:1px solid var(--border)}
.center{padding:14px;overflow-y:auto}
.panel-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;margin:8px;padding:10px}
.panel-title{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.agent-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer}
.agent-row:hover{background:var(--panel2)}
.online-pill{display:flex;align-items:center;gap:5px;background:rgba(0,255,65,.08);border:1px solid rgba(0,255,65,.2);padding:3px 10px;border-radius:12px;font-size:9px;color:var(--accent)}
.bottombar{background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px}
.bottom-tab{padding:8px 16px;font-size:9px;color:var(--text3);cursor:pointer}
.bottom-tab.active{color:var(--accent);border-top:2px solid var(--accent)}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
<div><span style="color:var(--accent);font-family:var(--font-h);font-size:14px">NEXUS AI</span>
<span class="nav-item active" onclick="show('overview')">Overview</span>
<span class="nav-item" onclick="show('tasks')">Tasks</span>
<span class="nav-item" onclick="show('network')">Network</span>
</div>
<div class="online-pill"><span style="width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block"></span>ONLINE</div>
</div>
<div class="main">
<div class="sidebar-left">
<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px">AI Agents — 16 Online</div>
<div id="agentList"></div>
</div>
<div class="center" id="centerBody">
<h2 style="color:var(--accent);font-family:var(--font-h);margin-bottom:12px">NEXUS COMMAND</h2>
<p style="color:var(--text2);line-height:1.6">All 16 agents operational. Creative pipeline ready. Use the Tasks tab to launch the AI Shorts Factory.</p>
<div class="panel-box">
<div class="panel-title">Quick Stats</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center">
<div><div style="font-size:24px;color:var(--accent)">16</div><div style="font-size:9px;color:var(--text3)">Agents</div></div>
<div><div style="font-size:24px;color:var(--accent)" id="stScr">0</div><div style="font-size:9px;color:var(--text3)">Scripts</div></div>
<div><div style="font-size:24px;color:var(--accent)" id="stVid">0</div><div style="font-size:9px;color:var(--text3)">Videos</div></div>
<div><div style="font-size:24px;color:var(--accent)">99.9%</div><div style="font-size:9px;color:var(--text3)">Uptime</div></div>
</div>
</div>
</div>
<div class="sidebar-right">
<div class="panel-box">
<div class="panel-title">Live Logs</div>
<div id="liveLogs" style="font-size:9px;color:var(--text2);line-height:1.6"></div>
</div>
<div class="panel-box">
<div class="panel-title">System Status</div>
<div id="sysStats"></div>
</div>
</div>
</div>
<div class="bottombar">
<span class="bottom-tab active" onclick="show('overview')">Overview</span>
<span class="bottom-tab" onclick="show('tasks')">Tasks</span>
<span class="bottom-tab" onclick="show('map')">Map</span>
<span class="bottom-tab" onclick="show('console')">Console</span>
</div>
</div>
<script>
const AGENTS=['ORION','NOVA','ECHO','SAGE','VOLT','LYRA','ATLAS','KAI','ZENO','MIRA','AXIOM','PULSE','TITAN','NEBULA','CYPHER','DRIFT'];
const ROLES=['Strategist','Research','Data Analysis','Knowledge','Automation','Content','Operations','Development','Security','Monitoring','Planning','Communications','Infrastructure','Simulation','Encryption','Recon'];
document.getElementById('agentList').innerHTML=AGENTS.map((a,i)=>`<div class="agent-row"><div style="width:22px;height:22px;border-radius:4px;background:#111;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px">&#9679;</div><div style="flex:1"><div style="font-size:10px;font-weight:600">${a}</div><div style="font-size:8px;color:var(--text3)">${ROLES[i]}</div></div><div style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 4px rgba(0,255,65,.4)"></div></div>`).join('');

function addLog(s,m){const l=document.getElementById('liveLogs'),t=new Date().toLocaleTimeString([],{h:'2-digit',m:'2-digit',s:'2-digit'});l.innerHTML=`<div style="margin-bottom:4px"><span style="color:var(--text3)">${t}</span> <span style="color:var(--accent);font-weight:700">${s}</span> ${m}</div>`+l.innerHTML;if(l.children.length>20)l.lastChild.remove();}

function updateStats(){const s=document.getElementById('sysStats');s.innerHTML=['CPU','GPU','Memory','Network','Storage'].map(l=>{const v=30+Math.floor(Math.random()*40);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:50px;font-size:8px;color:var(--text3);text-transform:uppercase">${l}</span><div style="flex:1;height:6px;background:var(--panel3);border-radius:3px"><div style="height:100%;width:${v}%;background:var(--accent);border-radius:3px"></div></div><span style="width:28px;text-align:right;font-size:9px;color:var(--accent)">${v}%</span></div>`;}).join('');}

addLog('ORION','Planning route...');addLog('NOVA','Research complete');addLog('ECHO','Analyzing data...');addLog('SAGE','Updating knowledge');addLog('VOLT','Executing automation');
updateStats();
setInterval(updateStats,3000);
setInterval(()=>{const msgs=['Scanning sector...','Syncing comms...','Resources nominal','Simulating...','Recon active'];addLog(AGENTS[Math.floor(Math.random()*AGENTS.length)],msgs[Math.floor(Math.random()*msgs.length)]);},4000);

function show(v){document.querySelectorAll('.nav-item,.bottom-tab').forEach(el=>el.classList.remove('active'));event.target.classList.add('active');}
</script>
</body>
</html>
